<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Data Integration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Data Integration</h1>
    <p class="subtitle">Extract, Transform &amp; Merge CSV Data</p>
    <section class="student-info">
      <p><strong>Name:</strong> Oieu Nuneza</p>
      <p><strong>Schedule:</strong> It 3206N TTH 6:30 PM - 8:30 PM</p>
    </section>
    <form id="csvForm">
      <label for="sisFile">Source A — SIS CSV</label>
      <input type="file" id="sisFile" accept=".csv,text/csv" required>
      <label for="lmsFile">Source B — LMS CSV</label>
      <input type="file" id="lmsFile" accept=".csv,text/csv" required>
      <label for="accountingFile">Source C — Accounting CSV</label>
      <input type="file" id="accountingFile" accept=".csv,text/csv" required>
      <button type="submit">Extract, Transform &amp; Merge</button>
    </form>
    <p id="message" role="status"></p>
    <h2>JSON Output</h2>
    <pre id="output">No data converted yet.</pre>
    
  </main>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
